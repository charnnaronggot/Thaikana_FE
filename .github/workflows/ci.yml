name: Frontend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Sales production build
        run: npm run build
      - name: Full role production build
        run: npm run build:workspace
      - name: Production proxy regression
        run: |
          docker build --build-arg BUILD_CONFIGURATION=production,workspace -t thaikana-sales-frontend:test .
          node tests/deploy-proxy.smoke.cjs
